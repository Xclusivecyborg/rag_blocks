name: rag_blocks
description: >-
  Building blocks for local RAG pipelines in pure Dart: text splitting,
  CSV-to-prose, exact table maths, query rewriting, similarity ranking and an
  Ollama client.
version: 0.1.0
repository: https://github.com/Xclusivecyborg/rag_blocks
issue_tracker: https://github.com/Xclusivecyborg/rag_blocks/issues
topics:
  - rag
  - ollama
  - llm
  - embeddings
  - ai

environment:
  sdk: ^3.12.1

# Only package:http. Anything heavier (Flutter, ObjectBox) belongs to the app
# that composes these pieces, so this package runs under the plain Dart VM.
dependencies:
  http: ^1.6.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
